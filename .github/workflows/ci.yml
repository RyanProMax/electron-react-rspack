name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary Electron target. Linux runs the same suite under xvfb.
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Source typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: End-to-end
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test:e2e
          else
            pnpm test:e2e
          fi

      - name: Development and HMR regressions (macOS)
        if: runner.os == 'macOS'
        run: pnpm test:e2e:dev
        env:
          E2E_OUTPUT_DIR: test-results/development

      - name: Isolated unsigned local package and packaged smoke (macOS)
        if: runner.os == 'macOS'
        run: pnpm package:smoke && pnpm test:e2e:packaged
        env:
          E2E_OUTPUT_DIR: test-results/packaged
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ runner.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
