packages:
  - 'src/*'

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild

overrides:
  # Security fixes for transitive dependencies still using vulnerable versions.
  '@babel/core@<7.29.1': 7.29.7
  '@babel/plugin-transform-modules-systemjs': 7.29.7
  '@arco-plugins/unplugin-react>minimatch': 9.0.9
  '@rspack/dev-server>webpack-dev-server': 5.2.6
  '@svgr/plugin-svgo>svgo': 3.3.5
  'sockjs>uuid': 11.1.1
  'ts-node>diff': 4.0.4
  'brace-expansion@<1.1.21': 1.1.21
  'browserslist@<4.28.7': 4.28.7
  fast-uri: 3.1.8
  'http-proxy-middleware@<2.0.10': 2.0.10
  'nanoid@<3.3.18': 3.3.18
  'postcss@<8.5.23': 8.5.23
  'postcss-selector-parser@>=7.1.0 <7.1.3': 7.1.3
  'shell-quote@<1.8.5': 1.10.0
  webpack: 5.107.2
